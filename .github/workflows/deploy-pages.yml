name: Deploy Giraffe Jump to GitHub Pages

on:
  push:
    branches: [claude/giraffe-jump-game-yycscn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publish the game folder to the gh-pages branch; on public repos
      # GitHub Pages serves that branch automatically.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./giraffe-jump
